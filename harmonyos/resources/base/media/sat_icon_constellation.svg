      <stop offset="0%" stop-color="#9BE7FF"/>
      <stop offset="55%" stop-color="#539BFF"/>
      <stop offset="100%" stop-color="#345CEB"/>
    </linearGradient>
    <linearGradient id="leoBody" x1="0" y1="0" x2="1" y2="1">
