<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="commsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B7B"/>
      <stop offset="50%" stop-color="#8B6DFF"/>
      <stop offset="100%" stop-color="#3B82FF"/>
    </linearGradient>
    <linearGradient id="commsPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70D6FF"/>
      <stop offset="100%" stop-color="#2D6BFF"/>
    </linearGradient>
  </defs>
  <!-- Angled Classic Comms Satellite (dual panels + parabolic dish + radio waves) -->
  <g transform="rotate(-42 46 46)">
    <!-- Left & Right Gridded Solar Panels -->
    <rect x="8" y="34" width="23" height="17" rx="3" fill="url(#commsPanel)" stroke="#E3F4FF" stroke-width="1.3"/>
    <rect x="61" y="34" width="23" height="17" rx="3" fill="url(#commsPanel)" stroke="#E3F4FF" stroke-width="1.3"/>
    <path d="M15.5 35v15M23 35v15M68.5 35v15M76 35v15M9 42.5h21M62 42.5h21" stroke="#102F70" stroke-width="1" opacity="0.55"/>
    <!-- Struts -->
    <rect x="31" y="40.5" width="6" height="4" fill="#DCEBFF"/>
    <rect x="55" y="40.5" width="6" height="4" fill="#DCEBFF"/>
    <!-- Central Bus -->
    <rect x="36" y="28" width="20" height="29" rx="5.5" fill="url(#commsGrad)" stroke="#FFFFFF" stroke-width="1.4"/>
    <rect x="42" y="22" width="8" height="6" rx="2" fill="#FFC9D2"/>
    <!-- Parabolic High-Gain Dish -->
    <rect x="43" y="57" width="6" height="5" fill="#DCEBFF"/>
    <path d="M33 62 C33 74, 59 74, 59 62 Z" fill="url(#commsGrad)" stroke="#FFFFFF" stroke-width="1.4"/>
    <circle cx="46" cy="70" r="2.2" fill="#FFF3B0"/>
    <!-- Radiating Radio Signal Waves -->
    <path d="M38 77 C42 81, 50 81, 54 77" fill="none" stroke="#7AE8FF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M33 83 C40 89, 52 89, 59 83" fill="none" stroke="#5CB8FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
