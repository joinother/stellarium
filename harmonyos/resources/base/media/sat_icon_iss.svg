<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="issWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="55%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
    <linearGradient id="issCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#80C8FF"/>
    </linearGradient>
    <linearGradient id="issTruss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6CE5FF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#4A90FF"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-28 48 48)">
    <!-- Main Integrated Truss -->
    <rect x="8" y="45.5" width="80" height="5" rx="2.5" fill="url(#issTruss)"/>
    <!-- Port Outer & Inner Solar Array Pairs (4 wings left) -->
    <rect x="11" y="16" width="8.5" height="26" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <rect x="11" y="54" width="8.5" height="26" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <rect x="23" y="18" width="8.5" height="24" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <rect x="23" y="54" width="8.5" height="24" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <!-- Starboard Inner & Outer Solar Array Pairs (4 wings right) -->
    <rect x="64.5" y="18" width="8.5" height="24" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <rect x="64.5" y="54" width="8.5" height="24" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <rect x="76.5" y="16" width="8.5" height="26" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <rect x="76.5" y="54" width="8.5" height="26" rx="2" fill="url(#issWing)" stroke="#FFF5D6" stroke-width="1"/>
    <!-- Solar Cell Grid Lines -->
    <path d="M15.2 17v24M15.2 55v24M27.2 19v22M27.2 55v22M68.7 19v22M68.7 55v22M80.7 17v24M80.7 55v24" stroke="#8C4A08" stroke-width="0.9" opacity="0.55"/>
    <!-- Central Pressurized Modules & Destiny/Harmony/Zvezda Spine -->
    <rect x="43" y="28" width="10" height="40" rx="4.5" fill="url(#issCore)" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="35" y="42" width="26" height="12" rx="4" fill="url(#issCore)" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="48" cy="48" r="3.2" fill="#3B82F6"/>
    <!-- Radiator Panels -->
    <rect x="36" y="33" width="5" height="8" rx="1" fill="#BCE8FF" opacity="0.85"/>
    <rect x="55" y="55" width="5" height="8" rx="1" fill="#BCE8FF" opacity="0.85"/>
  </g>
</svg>
