    <rect x="10" y="40" width="24" height="14" rx="2.5" fill="url(#telWing)" stroke="#D9FAFF" stroke-width="1.1"/>
    <rect x="62" y="40" width="24" height="14" rx="2.5" fill="url(#telWing)" stroke="#D9FAFF" stroke-width="1.1"/>
    <path d="M18 41v12M26 41v12M70 41v12M78 41v12M11 47h22M63 47h22" stroke="#133A80" stroke-width="0.9" opacity="0.5"/>
