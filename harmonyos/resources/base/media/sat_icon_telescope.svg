<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="telTube" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2ECFF"/>
      <stop offset="55%" stop-color="#B9A6FF"/>
      <stop offset="100%" stop-color="#6F63D8"/>
    </linearGradient>
    <linearGradient id="telWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#76F4FF"/>
      <stop offset="100%" stop-color="#3B7BFF"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-34 48 48)">
