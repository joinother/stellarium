    <rect x="38" y="21" width="20" height="46" rx="5" fill="url(#telTube)" stroke="#FFFFFF" stroke-width="1.3"/>
    <!-- Aft Instrument Bay -->
    <rect x="35.5" y="54" width="25" height="18" rx="4" fill="#7D72E0" stroke="#EDE7FF" stroke-width="1.1"/>
    <!-- Open Aperture Door & Mirror Rim -->
