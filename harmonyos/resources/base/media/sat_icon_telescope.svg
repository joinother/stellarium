    <ellipse cx="48" cy="22" rx="9" ry="2.8" fill="#1C2754" stroke="#9EEAFF" stroke-width="1"/>
    <!-- Optical Star Glint -->
    <path d="M48 8 L49.5 12.5 L54 14 L49.5 15.5 L48 20 L46.5 15.5 L42 14 L46.5 12.5 Z" fill="#FFF3B0"/>
