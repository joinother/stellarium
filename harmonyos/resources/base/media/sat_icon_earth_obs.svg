<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="eoCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6DF5F5"/>
      <stop offset="55%" stop-color="#38A8FF"/>
      <stop offset="100%" stop-color="#266BFF"/>
    </linearGradient>
    <linearGradient id="eoSun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2A6"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>
  </defs>
  <!-- Earth Curved Limb + Latitude/Longitude Grid (Bottom Left) -->
  <path d="M10 56 A42 42 0 0 1 52 88" fill="none" stroke="url(#eoCyan)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M12 68 A32 32 0 0 1 39 88" fill="none" stroke="#2D7BFF" stroke-width="1.6" opacity="0.7"/>
  <path d="M22 57 C20 68, 22 78, 27 87" fill="none" stroke="#38A8FF" stroke-width="1.4" opacity="0.65"/>
  <!-- Solar Glint Cue (Top Left) -->
  <circle cx="24" cy="24" r="6.5" fill="none" stroke="url(#eoSun)" stroke-width="2.2"/>
  <path d="M24 13v2.5M24 32.5V35M13 24h2.5M32.5 24H35M16.5 16.5l1.8 1.8M29.7 29.7l1.8 1.8M31.5 16.5l-1.8 1.8M18.3 29.7l-1.8 1.8" stroke="#FFE082" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Reflected Glint Ray (Earth -> Satellite) -->
  <path d="M28 33 L38 56 L51 46" fill="none" stroke="#78F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M46 45.5 L51.5 45.5 L50.5 51" fill="none" stroke="#78F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Twin-Wing Earth Observation Satellite (Upper Right) -->
  <g transform="translate(64 36) rotate(42)">
    <rect x="-25" y="-6.5" width="16" height="13" rx="2" fill="url(#eoCyan)" stroke="#D9FEFF" stroke-width="1.1"/>
    <rect x="9" y="-6.5" width="16" height="13" rx="2" fill="url(#eoCyan)" stroke="#D9FEFF" stroke-width="1.1"/>
    <path d="M-19 -6v12M-14 -6v12M14 -6v12M19 -6v12M-24 0h14M10 0h14" stroke="#0B2E6B" stroke-width="0.85" opacity="0.55"/>
    <rect x="-8" y="-11" width="16" height="22" rx="4" fill="#0F264F" stroke="url(#eoCyan)" stroke-width="2"/>
    <rect x="-4" y="11" width="8" height="4" rx="1.5" fill="#6DF5F5"/>
  </g>
</svg>
