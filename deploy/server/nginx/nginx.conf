worker_processes 1;
pid /run/skyinstrument-website/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format site '$remote_addr [$time_iso8601] $request_method $uri $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/skyinstrument-website/access.log site;
    server_tokens off;

    # 限流：按来源 IP 限制请求速率与并发连接，正常访客无感
    limit_req_zone $binary_remote_addr zone=site_req:10m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=site_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;
    sendfile on;
    keepalive_timeout 15;
    client_header_timeout 10;
    client_body_timeout 10;
    send_timeout 15;
    client_max_body_size 1k;
    client_body_temp_path /run/skyinstrument-website/client;
    proxy_temp_path /run/skyinstrument-website/proxy;
    fastcgi_temp_path /run/skyinstrument-website/fastcgi;
    uwsgi_temp_path /run/skyinstrument-website/uwsgi;
    scgi_temp_path /run/skyinstrument-website/scgi;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate /etc/skyinstrument-website/tls/current/fullchain.pem;
    ssl_certificate_key /etc/skyinstrument-website/tls/current/privkey.pem;
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name skyinstrument.cn www.skyinstrument.cn;
        location ^~ /.well-known/acme-challenge/ { root /srv/skyinstrument/website/acme; }
        location / { return 301 https://skyinstrument.cn$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name www.skyinstrument.cn;
        root /srv/skyinstrument/website/current;

        # 搜索引擎验证文件要求在 www 根目录可直接访问，不能被 301 掉
        location ~* ^/(baidu_verify_[A-Za-z0-9_-]+\.html|BingSiteAuth\.xml|google[0-9a-f]+\.html)$ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 301 https://skyinstrument.cn$request_uri;
        }
    }
    server {
        listen 443 ssl;
        server_name skyinstrument.cn;
        limit_req zone=site_req burst=30 nodelay;
        limit_conn site_conn 20;
        root /srv/skyinstrument/website/current;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        rewrite ^/(privacy|credits)/$ /$1 permanent;
        error_page 404 /404.html;
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type text/html;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            return 429 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>访问太频繁</title></head><body style="font-family:sans-serif;max-width:520px;margin:80px auto;padding:0 20px;color:#333"><h2>访问太频繁</h2><p>这个地址的请求过于集中，被临时限速了。</p><p>请等几秒后刷新。如果一直看到这个页面，可以发邮件到 1134873571@qq.com。</p></body></html>';
        }
                # 星象仪在线数据镜像（/srv/tle-mirror 由 tle-mirror.timer 每 3 小时刷新）
        # 今夜星 App API（Node 服务 @127.0.0.1:8090）
        location ^~ /nw/ {
            error_page 429 @rate_limited_api;
            proxy_pass http://127.0.0.1:8090/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store" always;
        }

        location @rate_limited_api {
            default_type application/json;
            add_header Retry-After 3 always;
            return 429 '{"ok":false,"error":"rate_limited","retry_after":3}';
        }

        location ^~ /v1/ {
            alias /srv/tle-mirror/v1/;
            default_type application/octet-stream;
            add_header Cache-Control "public, max-age=1800" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        # 只读状态页（Basic Auth 保护）
        location ^~ /status/ {
            alias /srv/skyinstrument/status/;
            index index.html;
            auth_basic "Skyinstrument Status";
            auth_basic_user_file /etc/skyinstrument-website/status.htpasswd;
            add_header Cache-Control "no-store" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            limit_req zone=site_req burst=10 nodelay;
            }

include /etc/skyinstrument-website/conf.d/*.conf;
        location ~ /\. { deny all; }
        # 带内容哈希的构建产物可长期缓存
        location ^~ /_next/static/ { expires 365d;     limit_req zone=site_req burst=100 nodelay;
        }

        # 站点图片
        location ^~ /images/ { expires 7d;     limit_req zone=site_req burst=100 nodelay;
        }

        # 页面与 RSC 载荷：必须回源校验，避免改版后浏览器仍显示旧内容
        location ~* \.(html|txt)$ { expires -1; }

        location / {
            try_files $uri $uri.html $uri/ =404;
            expires -1;
        }
    }
}
