# 星象仪在线数据镜像（只读静态站点）
# 放到 /etc/nginx/conf.d/tle-mirror.conf，域名换成你已备案的那个。
server {
    listen 80;
    server_name mirror.example.com;          # TODO 换成你的域名

    root /srv/tle-mirror;
    autoindex off;

    # TLE 每天更新多次，缓存 30 分钟足够；目录清单缓存 5 分钟。
    location /v1/catalogs/ {
        add_header Cache-Control "public, max-age=1800";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location = /v1/manifest.json {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
